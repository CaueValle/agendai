[project]
name = "agendai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "caue", email = "caue.valle@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]